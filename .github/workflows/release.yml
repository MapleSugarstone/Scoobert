name: Release

on:
  push:
    tags: ["v*"]
    # A push to the macos branch builds only the Mac app, for testing before a release.
    branches: ["macos"]
  workflow_dispatch:

# GitHub once started two runs for one tag push, and the second failed to create a release that already existed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LLAMA_RELEASE: b11193
  CARGO_TERM_COLOR: always

jobs:
  windows:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch llama.cpp
        run: ./scripts/fetch-llama.ps1 -Release $env:LLAMA_RELEASE
      - name: Build the steering tool
        run: ./scripts/build-llama-tools.ps1 -Release $env:LLAMA_RELEASE
      # Newer Windows runner images no longer include NSIS.
      - name: Install NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
      - name: Build the installer
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Scoobert-Setup-*.exe
            dist/Scoobert-*-portable-windows.zip

  linux:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    # The oldest supported Ubuntu keeps the binary compatible with older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libdbus-1-dev
      - name: Test
        run: cargo test --lib
      - name: Fetch llama.cpp
        run: bash scripts/fetch-llama.sh "$LLAMA_RELEASE"
      - name: Build the steering tool
        run: bash scripts/build-llama-tools.sh "$LLAMA_RELEASE"
      - name: Build the AppImage and tarball
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  macos:
    # Apple Silicon. The app is signed ad hoc and not notarized.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --lib
      - name: Fetch llama.cpp
        run: bash scripts/fetch-llama.sh "$LLAMA_RELEASE"
      - name: Build the steering tool
        run: bash scripts/build-llama-tools.sh "$LLAMA_RELEASE"
      - name: Build the app and disk image
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" --title "Scoobert ${GITHUB_REF_NAME#v}" --generate-notes
          fi
