name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  LLAMA_RELEASE: b11193
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch llama.cpp
        run: ./scripts/fetch-llama.ps1 -Release $env:LLAMA_RELEASE
      - name: Build the installer
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Scoobert-Setup-*.exe
            dist/Scoobert-*-portable-windows.zip

  linux:
    # The oldest supported Ubuntu keeps the binary compatible with older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libdbus-1-dev
      - name: Test
        run: cargo test --lib
      - name: Fetch llama.cpp
        run: bash scripts/fetch-llama.sh "$LLAMA_RELEASE"
      - name: Build the AppImage and tarball
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" --title "Scoobert ${GITHUB_REF_NAME#v}" --generate-notes
